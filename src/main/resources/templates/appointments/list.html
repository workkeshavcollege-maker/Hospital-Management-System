<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Appointments Schedule')}"></head>
<body>

<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar('appointments')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Hospital Appointments Management')}"></header>

        <main class="page-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Search and Filter Bar -->
            <div class="search-filter-box">
                <form th:action="@{/appointments}" method="get" th:object="${filter}"
                      style="display: flex; gap: 10px; flex: 1; align-items: center; flex-wrap: wrap;">

                    <!-- Filter by Doctor -->
                    <select th:field="*{doctorId}" class="form-control" style="max-width: 220px;">
                        <option value="">-- All Doctors --</option>
                        <option th:each="doc : ${doctors}" th:value="${doc.doctorId}" th:text="'Dr. ' + ${doc.fullName} + ' (' + ${doc.specialization} + ')'"></option>
                    </select>

                    <!-- Filter by Patient -->
                    <select th:field="*{patientId}" class="form-control" style="max-width: 220px;">
                        <option value="">-- All Patients --</option>
                        <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.fullName} + ' (#' + ${p.patientId} + ')'"></option>
                    </select>

                    <!-- Filter by Status -->
                    <select th:field="*{status}" class="form-control" style="max-width: 160px;">
                        <option value="ALL">All Statuses</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                        <option value="NO_SHOW">No Show</option>
                    </select>

                    <!-- Date range -->
                    <input type="date" th:field="*{startDate}" class="form-control" style="max-width: 150px;" title="From Date">
                    <input type="date" th:field="*{endDate}" class="form-control" style="max-width: 150px;" title="To Date">

                    <button type="submit" class="btn btn-primary btn-sm">&#128269; Apply Filter</button>
                    <a th:href="@{/appointments}" class="btn btn-outline btn-sm">Reset</a>
                </form>

                <div>
                    <a th:href="@{/appointments/book}" class="btn btn-secondary">&#10010; Book New Slot</a>
                </div>
            </div>

            <!-- Appointments Table -->
            <div class="content-card">
                <div class="card-header">
                    <h2>Appointments Roster</h2>
                    <span style="font-size: 13px; color: var(--gray-600);" th:text="${#lists.size(appointments)} + ' Appointments Listed'">0 Appointments</span>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-responsive">
                        <table class="custom-table searchable-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Appointment Date & Time</th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Fee</th>
                                    <th>Reason / Notes</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(appointments)}">
                                    <td colspan="8" style="text-align: center; color: var(--gray-400); padding: 30px;">
                                        No appointments found matching the selected filter criteria.
                                    </td>
                                </tr>
                                <tr th:each="appt : ${appointments}">
                                    <td th:text="'#' + ${appt.appointmentId}" style="font-weight: 600;">#1</td>
                                    <td th:text="${#temporals.format(appt.appointmentDatetime, 'dd-MMM-yyyy HH:mm')}">15-Oct-2026 10:30</td>
                                    <td>
                                        <a th:href="@{'/patients/' + ${appt.patientId}}" th:text="${appt.patientName}" style="font-weight: 600; color: var(--primary); text-decoration: none;">John Doe</a>
                                        <div style="font-size: 12px; color: var(--gray-600);" th:text="${appt.patientPhone}">9876543210</div>
                                    </td>
                                    <td>
                                        <a th:href="@{'/doctors/' + ${appt.doctorId}}" th:text="'Dr. ' + ${appt.doctorName}" style="font-weight: 600; color: var(--dark); text-decoration: none;">Dr. Sharma</a>
                                        <div style="font-size: 12px; color: var(--gray-600);" th:text="${appt.doctorSpecialization}">Cardiology</div>
                                    </td>
                                    <td th:text="'₹' + ${#numbers.formatDecimal(appt.doctorFee != null ? appt.doctorFee : 0, 1, 2)}">₹750.00</td>
                                    <td th:text="${appt.reason != null ? appt.reason : '-'}">Follow-up</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${appt.status == 'SCHEDULED'} ? 'badge-scheduled' : (${appt.status == 'COMPLETED'} ? 'badge-completed' : (${appt.status == 'CANCELLED'} ? 'badge-cancelled' : 'badge-noshow'))"
                                              th:text="${appt.status}">
                                            SCHEDULED
                                        </span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                                            <a th:if="${appt.status == 'SCHEDULED'}" th:href="@{'/appointments/' + ${appt.appointmentId} + '/reschedule'}" class="btn btn-sm btn-outline">Reschedule</a>
                                            
                                            <!-- Status quick buttons -->
                                            <form th:if="${appt.status == 'SCHEDULED'}" th:action="@{'/appointments/' + ${appt.appointmentId} + '/status'}" method="post" style="display:inline;">
                                                <input type="hidden" name="status" value="COMPLETED">
                                                <button type="submit" class="btn btn-sm btn-success">Complete</button>
                                            </form>

                                            <form th:if="${appt.status == 'SCHEDULED'}" th:action="@{'/appointments/' + ${appt.appointmentId} + '/status'}" method="post" style="display:inline;">
                                                <input type="hidden" name="status" value="CANCELLED">
                                                <button type="submit" class="btn btn-sm btn-danger" data-confirm="Are you sure you want to cancel this appointment?">Cancel</button>
                                            </form>

                                            <form th:if="${appt.status == 'SCHEDULED'}" th:action="@{'/appointments/' + ${appt.appointmentId} + '/status'}" method="post" style="display:inline;">
                                                <input type="hidden" name="status" value="NO_SHOW">
                                                <button type="submit" class="btn btn-sm btn-outline" data-confirm="Mark patient as No Show?">No Show</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
</body>
</html>
