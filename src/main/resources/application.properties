# ==============================================================================
# HOSPITAL MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# College PAT 4 Practical Examination
# ==============================================================================

spring.application.name=Hospital Management System
server.port=${SERVER_PORT:8081}

# ------------------------------------------------------------------------------
# Oracle FreeSQL Database Configuration via Spring JDBC / HikariCP
# ------------------------------------------------------------------------------
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME:}
spring.datasource.password=${ORACLE_DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool Settings optimized for Oracle Cloud / FreeSQL
spring.datasource.hikari.pool-name=HospitalHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# STRICT: Never execute DDL or automated SQL initialization against remote schema
spring.sql.init.mode=never

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Initial Administrator Bootstrap Credentials (Fallback defaults)
# ------------------------------------------------------------------------------
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:admin}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:Admin@123}

# Logging configuration
logging.level.root=INFO
logging.level.com.hospital=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
